[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv",
    "frontend",
    "ml/data/raw",
    "ml/artifacts",
    "mlruns",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
